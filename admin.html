<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>SPIXD 機材管理</title>
  <link rel="stylesheet" href="css/style.css?v=20260927-4">
  <link rel="stylesheet" href="css/admin.css?v=20260928-1">
</head>
<body>
  <header class="app-header plan-header">
    <p class="eyebrow">SPIXD EQUIPMENT</p>
    <h1>機材管理</h1>
    <p>撮影計画で使用する機材マスターを管理します。</p>
  </header>
  <main class="admin-main">
    <section id="loginPanel" class="card admin-login">
      <h2>管理用URLを確認してください</h2>
      <p>このページを開くには、管理用アクセスキーを含む専用URLが必要です。</p>
      <p id="loginMessage" class="admin-message" aria-live="polite"></p>
    </section>

    <div id="adminPanel" hidden>
      <div class="admin-toolbar">
        <div><strong>機材マスター</strong><span id="itemCount"></span></div>
        <button id="logoutButton" class="secondary-button" type="button">ログアウト</button>
      </div>

      <section class="card admin-form">
        <h2>機材を追加</h2>
        <div class="admin-grid">
          <label>カテゴリー<select id="newCategory"></select></label>
          <label>機材名<input id="newName" type="text" placeholder="例：カメラ"></label>
          <label class="wide">確認メモ<input id="newNote" type="text" placeholder="例：本体・バッテリーを確認"></label>
          <label>標準数量<input id="newQty" type="number" min="1" max="99" value="1"></label>
          <label>表示順<input id="newOrder" type="number" value="210"></label>
          <label class="check-label"><input id="newSelected" type="checkbox"> 初期選択する</label>
          <div class="wide icon-field"><span class="field-label">アイコン</span><div id="newIconPicker"></div><input id="newIcon" type="hidden" value="plus"></div>
        </div>
        <button id="addEquipment" class="primary-button" type="button">機材を追加</button>
        <p id="formMessage" class="admin-message" aria-live="polite"></p>
      </section>

      <section class="card admin-form">
        <details>
          <summary>カテゴリーを追加</summary>
          <div class="admin-grid category-grid">
            <label>カテゴリーID<input id="categoryId" type="text" placeholder="例：lighting"></label>
            <label>表示名<input id="categoryName" type="text" placeholder="例：照明機材"></label>
            <label class="wide">説明<input id="categoryDescription" type="text"></label>
            <label>表示順<input id="categoryOrder" type="number" value="70"></label>
          </div>
          <button id="addCategory" class="secondary-button" type="button">カテゴリーを追加</button>
        </details>
      </section>

      <section>
        <div class="section-heading admin-heading"><div><p class="step">LIST</p><h2>登録機材</h2></div><p>変更後は機材ごとに保存します</p></div>
        <div id="equipmentAdminList" class="admin-list"></div>
      </section>
    </div>
  </main>
  <script src="js/admin.js?v=20260928-1"></script>
</body>
</html>
