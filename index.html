<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>SPIXD PACK CHECK</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <p class="eyebrow">SPIXD EQUIPMENT</p>
    <h1>PACK CHECK</h1>
    <p>持参するか、持参しないか。全機材を出発前に確認します。</p>
  </header>

  <main id="checkView">
    <section class="card job-card">
      <h2>案件情報</h2>
      <label>イベント名<input id="eventName" type="text" placeholder="例：○○フォトブース" autocomplete="off"></label>
      <label>確認担当者<input id="staffName" type="text" placeholder="例：寺川" autocomplete="name"></label>
      <label>実施日<input id="eventDate" type="date"></label>
    </section>

    <section class="section-heading">
      <div><p class="step">01</p><h2>基本機材</h2></div>
      <p>通常のSPIXD運用で確認する機材</p>
    </section>
    <div id="basicList" class="equipment-list"></div>

    <section class="section-heading special-heading">
      <div><p class="step">02</p><h2>特別機材</h2></div>
      <p>使用頻度が低いものも、毎回判断します</p>
    </section>
    <div id="specialList" class="equipment-list"></div>

    <section class="card add-card">
      <h2>今回だけの追加機材</h2>
      <div class="add-row">
        <input id="customItem" type="text" placeholder="機材名を入力">
        <button id="addItem" type="button">追加</button>
      </div>
    </section>

    <div class="progress-panel">
      <div><strong id="progressText">0 / 0</strong><span>確認済み</span></div>
      <progress id="progressBar" value="0" max="1"></progress>
      <p id="validationMessage" aria-live="polite"></p>
      <button id="submitButton" class="primary-button" type="button">確認を完了する</button>
    </div>
  </main>

  <main id="resultView" class="result-view" hidden>
    <article id="resultCard" class="result-card">
    <div class="document-label">SPIXD PACK CHECK｜積み込み確認書</div>
    <section class="completion">
      <div class="checkmark">✓</div>
      <p class="eyebrow">SPIXD EQUIPMENT</p>
      <h1>機材確認 完了</h1>
      <p id="completedAt"></p>
    </section>
    <section class="card summary-card">
      <dl>
        <div><dt>イベント</dt><dd id="resultEvent"></dd></div>
        <div><dt>実施日</dt><dd id="resultDate"></dd></div>
        <div><dt>確認担当</dt><dd id="resultStaff"></dd></div>
      </dl>
      <div class="counts">
        <div><strong id="bringCount">0</strong><span>持参</span></div>
        <div><strong id="clientCount">0</strong><span>先方用意</span></div>
        <div><strong id="skipCount">0</strong><span>今回は不要</span></div>
      </div>
    </section>
    <div id="resultLists"></div>
    <footer class="card-footer">株式会社QLCLE｜SPIXD</footer>
    </article>
    <p class="screenshot-note">上のカード全体をスクリーンショットして共有してください。</p>
    <button id="backButton" class="secondary-button" type="button">チェック画面に戻る</button>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
